name: Generate Pac-Man Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "query($login:String!, $from:DateTime!, $to:DateTime!) { user(login:$login) { contributionsCollection(from:$from, to:$to) { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount contributionCalendar { totalContributions weeks { contributionDays { contributionCount date color } } } } } }",
              "variables": {
                "login": "het-parekh05",
                "from": "2025-08-23T00:00:00Z",
                "to": "2026-08-22T23:59:59Z"
              }
            }' \
            https://api.github.com/graphql \
            -o contribution-data.json

      - name: Verify contribution data
        run: |
          python - <<'PY'
          import json

          with open("contribution-data.json") as f:
              data = json.load(f)

          if "errors" in data:
              print(json.dumps(data, indent=2))
              raise SystemExit("GitHub GraphQL returned an error.")

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          print("Total contributions:", calendar["totalContributions"])
          print("Weeks:", len(calendar["weeks"]))
          print("Contribution days:",
                sum(len(w["contributionDays"]) for w in calendar["weeks"]))
          PY

      - name: Generate synchronized Pac-Man SVG
        run: |
          python scripts/generate_pacman.py contribution-data.json

      - name: Publish generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output:output || true

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          cp /tmp/pacman-contribution-graph.svg .
          cp /tmp/pacman-contribution-graph-dark.svg .

          git add pacman-contribution-graph.svg
          git add pacman-contribution-graph-dark.svg

          git diff --cached --quiet || git commit -m "Update contribution arcade"

          git push origin output

name: Generate Pac-Man Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ONE_YEAR_AGO=$(date -u -d "1 year ago" +"%Y-%m-%dT%H:%M:%SZ")
          
          # Safely construct the JSON payload with dynamic dates
          jq -n \
            --arg login "het-parekh05" \
            --arg from "$ONE_YEAR_AGO" \
            --arg to "$NOW" \
            '{
              query: "query($login:String!, $from:DateTime!, $to:DateTime!) { user(login:$login) { contributionsCollection(from:$from, to:$to) { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date color } } } } } }",
              variables: {
                login: $login,
                from: $from,
                to: $to
              }
            }' > query.json
            
          curl -s -L \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @query.json \
            https://api.github.com/graphql \
            -o contribution-data.json
            
          # Validate fetching success
          if ! grep -q "contributionCalendar" contribution-data.json; then
            echo "Error: Failed to fetch valid contribution data."
            cat contribution-data.json
            exit 1
          fi

      - name: Generate Pac-Man SVG
        run: |
          python scripts/generate_pacman.py contribution-data.json
          
          echo "Validating SVG generation..."
          if [ ! -f /tmp/pacman-contribution-graph.svg ] || [ ! -f /tmp/pacman-contribution-graph-dark.svg ]; then
            echo "Error: Expected SVG files were not generated."
            exit 1
          fi
          
          if [ ! -s /tmp/pacman-contribution-graph.svg ]; then
            echo "Error: Generated SVG file is empty."
            exit 1
          fi
          
          # Validate that no green github contribution colors are accidentally present
          if grep -E -i '#216e39|#30a14e|#40c463|#9be9a8' /tmp/pacman-contribution-graph.svg; then
            echo "Error: Original GitHub green colors found in SVG. The graph must use custom arcade colors."
            exit 1
          fi

          echo "Pac-Man SVG generated and validated successfully."

      - name: Publish generated SVGs
        run: |
          mkdir -p /tmp/output
          cp /tmp/pacman-contribution-graph.svg /tmp/output/
          cp /tmp/pacman-contribution-graph-dark.svg /tmp/output/

          git checkout --detach
          git branch -D output 2>/dev/null || true
          git fetch origin output:output 2>/dev/null || true

          if git show-ref --verify --quiet refs/heads/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          cp /tmp/output/pacman-contribution-graph.svg .
          cp /tmp/output/pacman-contribution-graph-dark.svg .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman-contribution-graph.svg
          git add pacman-contribution-graph-dark.svg

          if git diff --cached --quiet; then
            echo "No SVG changes."
          else
            git commit -m "Update contribution arcade"
            git push origin output
          fi

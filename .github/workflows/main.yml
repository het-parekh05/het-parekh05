name: Generate Pac-Man Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "query($login:String!, $from:DateTime!, $to:DateTime!) { user(login:$login) { contributionsCollection(from:$from, to:$to) { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date color } } } } } }",
              "variables": {
                "login": "het-parekh05",
                "from": "2025-08-23T00:00:00Z",
                "to": "2026-08-22T23:59:59Z"
              }
            }' \
            https://api.github.com/graphql \
            -o contribution-data.json

      - name: Verify contribution data
        run: |
          python - <<'PY'
          import json

          with open("contribution-data.json") as f:
              data = json.load(f)

          if "errors" in data:
              raise SystemExit(json.dumps(data["errors"], indent=2))

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          print("Total contributions:", calendar["totalContributions"])
          print("Weeks:", len(calendar["weeks"]))
          PY

      - name: Generate Pac-Man SVG
        run: |
          python scripts/generate_pacman.py contribution-data.json

          echo "Checking generated SVG..."

          if grep -Eiq '#(9be9a8|40c463|30a14e|216e39|0e4429|006d32|26a641|39d353)' /tmp/pacman-contribution-graph.svg; then
            echo "ERROR: GitHub green detected in generated SVG."
            exit 1
          fi

          echo "No GitHub green detected."

      - name: Publish generated SVGs
        run: |
          mkdir -p /tmp/output

          cp /tmp/pacman-contribution-graph.svg /tmp/output/
          cp /tmp/pacman-contribution-graph-dark.svg /tmp/output/

          git checkout --detach

          git branch -D output 2>/dev/null || true

          git fetch origin output:output 2>/dev/null || true

          if git show-ref --verify --quiet refs/heads/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          cp /tmp/output/pacman-contribution-graph.svg .
          cp /tmp/output/pacman-contribution-graph-dark.svg .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pacman-contribution-graph.svg
          git add pacman-contribution-graph-dark.svg

          if git diff --cached --quiet; then
            echo "No SVG changes."
          else
            git commit -m "Update contribution arcade"
            git push origin output
          fi
